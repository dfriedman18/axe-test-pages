<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>axe-core aria-tab-name test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 2rem;
        }

        [role="tablist"] {
            display: flex;
            gap: 0.5rem;
        }

        [role="tab"] {
            min-width: 8rem;
            min-height: 3rem;
        }

        div {
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>
    <h1>aria-tab-name test page</h1>

    <p>
        The first two tabs intentionally have no accessible name.
        The third tab should pass.
    </p>

    <div role="tablist" aria-label="Example tabs">
        <!-- Intentionally violates aria-tab-name -->
        <div
            role="tab"
            tabindex="0"
            aria-selected="true">
        </div>
    
        <!-- Should pass aria-tab-name -->
        <div
            role="tab"
            tabindex="-1"
            aria-selected="false">
            Settings
        </div>

        <button role="tab" aria-selected="false">
            Settings
        </button>
    </div>
    <div>
        <a href="/axe-test-pages/aria-tab-name-and-meta-viewport.html" target="_blank">Test Page with Metadata Issue</a>
    </div>
</body>
</html>
